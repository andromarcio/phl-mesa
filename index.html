<!-- Redirecionamento e espelhamento idêntico ao index.html com design FDD AVAL -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentação — GPE</title>
  <link rel="icon" type="image/svg+xml" href="identidade-visual/logos/aval-simbolo-azul-mini.svg">

  <!-- Configuração por repositório (nome do projeto) -->
  <script src="assets/js/config.js"></script>

  <!-- Google Fonts: Archivo (títulos) + IBM Plex Sans (corpo) + IBM Plex Mono (código/IDs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bibliotecas externas locais -->
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/mermaid.min.js"></script>
  <link rel="stylesheet" href="assets/css/mapa.css">

  <style>
    /* ==========================================================================
       TOKENS & VARIÁVEIS — Design System AVAL + Clean Doc Theme
       Marca: o azul constrói, o verde aprova.
       ========================================================================== */
    :root {
      /* Identidade AVAL */
      --brand-blue: #005CA9;
      --brand-blue-dark: #0A2440;
      --brand-blue-light: #E5F2FC;
      --brand-blue-hover: #004B8A;
      --brand-accent: #0078E0;
      
      /* Aviso é Dourado no AVAL (regra: nunca laranja) */
      --brand-gold: #B45309;
      --brand-gold-light: #FFFBEB;
      --brand-gold-border: #FDE68A;
      
      /* Superfícies & Bordas */
      --bg-app: #F6FAFD;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-hover: #EDF3F9;
      --bg-active: #E3EEF8;
      --border-color: #D6E3F0;
      --border-subtle: #E8F0F8;
      
      /* Compatibilidade mapa.css */
      --primary-color: #005CA9;
      --surface-ground: #F6FAFD;
      --surface-card: #FFFFFF;
      --surface-border: #D6E3F0;
      --surface-hover: #EDF3F9;
      --text-color: #0A2440;
      --shadow-1: 0 1px 3px rgba(10, 36, 64, 0.06);
      --focus-ring: 0 0 0 3px rgba(0, 92, 169, 0.18);
      --dsc-font-family-1: 'IBM Plex Sans', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      --dsc-font-title: 'Archivo', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      --dsc-font-mono: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "Courier New", monospace;
      --dsc-border-radius-pill: 999px;
      --dsc-border-radius-medium: 6px;
      --transition-duration: 0.15s;
      
      /* Tipografia & Cores */
      --text-main: #0A2440;
      --text-secondary: #2B3A4A;
      --text-muted: #526981;
      --text-blue: #005CA9;
      
      /* Status & Badges */
      --badge-success-bg: #ECFDF5;
      --badge-success-text: #047857;
      --badge-success-border: #A7F3D0;
      
      --badge-warning-bg: #FFFBEB;
      --badge-warning-text: #B45309;
      --badge-warning-border: #FDE68A;
      
      --badge-info-bg: #EFF6FF;
      --badge-info-text: #1D4ED8;
      --badge-info-border: #BFDBFE;
      
      --badge-purple-bg: #F5F3FF;
      --badge-purple-text: #6D28D9;
      --badge-purple-border: #DDD6FE;

      /* Sombras & Raios */
      --shadow-sm: 0 1px 2px 0 rgba(10, 36, 64, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(10, 36, 64, 0.08), 0 2px 4px -2px rgba(10, 36, 64, 0.05);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
      --radius-full: 999px;

      /* Dimensões */
      --header-height: 60px;
      --sidebar-width: 320px;
    }

    /* ---- Modo Árvore Sintética (Exclusivo para os cards do canvas do Mapa) ---- */
    .mm-wrap.mm-synthetic .mm-card {
      width: auto !important;
      min-width: 160px !important;
      max-width: 400px !important;
      flex: 0 0 auto !important;
      padding: 4px 10px !important;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 6px !important;
      border-radius: var(--radius-sm) !important;
    }
    .mm-wrap.mm-synthetic .mm-card .mm-badge {
      margin-bottom: 0 !important;
      font-size: 9.5px !important;
      padding: 1px 5px !important;
      border-radius: 3px !important;
      background: var(--bg-hover) !important;
      border: 1px solid var(--border-color) !important;
      flex-shrink: 0 !important;
      white-space: nowrap !important;
    }
    .mm-wrap.mm-synthetic .mm-card .mm-name {
      font-size: 11.5px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      flex: 1 1 auto !important;
    }
    /* O card sintético é uma LINHA (flex-direction: row): tudo o que não for o
       badge e o nome precisa sair, senão vira coluna irmã e espreme o nome até
       o reticências. Vale para as camadas 2 e 3 da descrição também. */
    .mm-wrap.mm-synthetic .mm-card .mm-desc,
    .mm-wrap.mm-synthetic .mm-card .mm-camada,
    .mm-wrap.mm-synthetic .mm-card .mm-foot,
    .mm-wrap.mm-synthetic .mm-card .mm-open {
      display: none !important;
    }
    .mm-btn.is-on {
      background: var(--brand-blue) !important;
      color: #ffffff !important;
      border-color: var(--brand-blue) !important;
    }

    /* Alinhamento à direita para os controles do Mapa */
    .mm-right {
      display: flex !important;
      flex-direction: column !important;
      gap: 10px !important;
      align-items: flex-end !important;
    }
    .mm-controls {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      flex-wrap: wrap !important;
      justify-content: flex-end !important;
    }
    .mm-actions {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      flex-wrap: wrap !important;
      justify-content: flex-end !important;
    }

    /* Linhas conectoras dos cards do Mapa */
    .mm-bus,
    .mm-node:not(.mm-collapsed):not(.mm-leaf) > .mm-card::after,
    .mm-kids > .mm-node > .mm-card::before {
      background: #8AA0B8 !important;
    }
    [data-theme="dark"] .mm-bus,
    [data-theme="dark"] .mm-node:not(.mm-collapsed):not(.mm-leaf) > .mm-card::after,
    [data-theme="dark"] .mm-kids > .mm-node > .mm-card::before {
      background: #4A6382 !important;
    }

    [data-theme="dark"] {
      --bg-app: #0A1A2E;
      --bg-sidebar: #0F2036;
      --bg-card: #0F2036;
      --bg-hover: #162941;
      --bg-active: #1C3554;
      --border-color: #1F3A5A;
      --border-subtle: #162941;
      
      --text-main: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.78);
      --text-muted: #8AA0B8;
      --text-blue: #33A0FF;
      
      --brand-blue-light: rgba(51, 160, 255, 0.15);
      --brand-gold-light: rgba(180, 83, 9, 0.2);

      --primary-color: #33A0FF;
      --surface-ground: #0A1A2E;
      --surface-card: #0F2036;
      --surface-border: #1F3A5A;
      --surface-hover: #162941;
      --text-color: rgba(255, 255, 255, 0.92);
    }

    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--dsc-font-family-1);
      background-color: var(--bg-app);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Layout Estrutural */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ==========================================================================
       HEADER FULL-WIDTH
       ======================================================================== */
    .app-header {
      height: var(--header-height);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--dsc-font-title);
      font-weight: 700;
      font-size: 16px;
      color: var(--brand-blue);
      text-decoration: none;
      cursor: pointer;
    }

    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-icon img.logo-light,
    .brand-icon img.logo-dark {
      height: 26px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .brand-icon img.logo-dark {
      display: none;
    }
    [data-theme="dark"] .brand-icon img.logo-light {
      display: none;
    }
    [data-theme="dark"] .brand-icon img.logo-dark {
      display: block;
    }

    #brandName {
      font-family: var(--dsc-font-title);
      font-weight: 600;
      font-size: 15px;
      color: var(--text-main);
      padding-left: 10px;
      border-left: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .brand-badge {
      font-size: 10px;
      font-family: var(--dsc-font-mono);
      background: var(--brand-blue-light);
      color: var(--brand-blue);
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(0, 92, 169, 0.25);
    }
    [data-theme="dark"] .brand-badge {
      background: rgba(51, 160, 255, 0.18);
      color: #8FCBFF;
      border-color: rgba(51, 160, 255, 0.35);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .header-center {
      flex: 1;
      max-width: 580px;
      margin: 0 24px;
      position: relative;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      height: 38px;
      padding: 0 40px 0 36px;
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: var(--dsc-font-family-1);
      color: var(--text-main);
      transition: all 0.2s;
      outline: none;
    }
    .search-box input:focus {
      background: var(--bg-sidebar);
      border-color: var(--brand-blue);
      box-shadow: var(--focus-ring);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: var(--dsc-font-mono);
    }

    /* Modal / Popover de Busca */
    .search-results-modal {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      max-height: 380px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .search-results-modal.show {
      display: block;
    }
    .search-result-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-decoration: none;
    }
    .search-result-item:hover, .search-result-item.selected {
      background: var(--bg-hover);
    }
    .search-result-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-blue);
    }
    [data-theme="dark"] .search-result-title {
      color: var(--text-blue);
    }
    .search-result-path {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: var(--dsc-font-mono);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Toggle Modo PO vs Técnico */
    .view-mode-toggle {
      display: flex;
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--dsc-font-family-1);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--bg-sidebar);
      color: var(--brand-blue);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    [data-theme="dark"] .mode-btn.active {
      color: var(--text-blue);
    }

    /* ==========================================================================
       APP BODY: SIDEBAR + RESIZER + CONTEÚDO 100%
       ========================================================================== */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      min-width: 220px;
      max-width: 640px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      transition: margin-left 0.2s ease;
    }
    .sidebar.collapsed {
      display: none;
    }

    /* RESIZER (Alça de redimensionamento da sidebar) */
    .sidebar-resizer {
      width: 5px;
      cursor: col-resize;
      background: transparent;
      position: relative;
      flex-shrink: 0;
      transition: background 0.15s;
      z-index: 20;
    }
    .sidebar-resizer:hover,
    .sidebar-resizer.is-resizing {
      background: var(--brand-blue);
    }
    .sidebar-resizer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -3px;
      right: -3px;
    }
    body.is-resizing-sidebar {
      cursor: col-resize !important;
      user-select: none !important;
    }

    .sidebar-section {
      padding: 8px 12px 4px 12px;
    }

    .sidebar-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 8px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item-fixed a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.15s;
    }
    .nav-item-fixed a:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .nav-item-fixed a.active {
      background: var(--brand-blue-light);
      color: var(--brand-blue);
      font-weight: 600;
    }

    /* Pastas de navegação internas */
    .nav-folder {
      margin: 2px 0;
    }
    .nav-folder summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.15s;
      user-select: none;
    }
    .nav-folder summary::-webkit-details-marker {
      display: none;
    }
    .nav-folder summary:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .nav-folder summary.active {
      background: var(--brand-blue-light);
      color: var(--brand-blue);
      font-weight: 600;
    }
    .nav-folder-title {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      white-space: nowrap;
      /* Sem isto o título não encolhe abaixo do próprio conteúdo e empurra o
         contador e a seta para fora do menu. */
      min-width: 0;
    }
    /* O `text-outflow` vivia no contêiner flex, onde não tem efeito: quem corta é
       o item de texto. Sem isto o nome longo era cortado a seco, sem reticências —
       e a seta, que ocupa ~19px à direita, deixou o corte visível. */
    .nav-folder-title > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .nav-folder-icon {
      color: #4DA8DA;
      flex-shrink: 0;
    }
    .domain-tag {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--dsc-font-mono);
      background: var(--brand-blue);
      color: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .chevron-icon {
      color: var(--text-muted);
      transition: transform 0.2s, background 0.15s, color 0.15s;
      flex-shrink: 0;
      /* Alvo de clique maior que o desenho. A seta é o único jeito de expandir um
         menu SEM trocar a página aberta (o resto do summary navega), e 11px é alvo
         difícil: errar por um pixel navega — exatamente o que a seta evita. O
         padding cresce a área sensível e a margem negativa devolve o espaço, então
         o leiaute não muda. */
      box-sizing: content-box;
      padding: 7px;
      margin: -7px;
      border-radius: var(--radius-sm);
    }
    .chevron-icon:hover {
      background: var(--bg-app);
      color: var(--text-primary);
    }
    /* Descendente, não filho direto: no feature set a seta fica dentro de
       .nav-folder-aside, ao lado do contador. Só alcança o summary do próprio
       nó — o summary de um filho não é descendente do summary do pai. */
    .nav-folder[open] > summary .chevron-icon {
      transform: rotate(90deg);
    }
    /* Contador e seta juntos, à direita, sem brigar pelo espaço do título. */
    .nav-folder-aside {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-folder-content {
      padding-left: 12px;
      margin-left: 10px;
      border-left: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .fs-count {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-app);
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Nível 3: Feature (MD) e Itens de Navegação */
    .feature-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      margin: 2px 0;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .feature-item:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .feature-item.active,
    .nav-item-fixed a.active,
    .nav-folder summary.active {
      background: var(--brand-blue-light) !important;
      color: var(--brand-blue) !important;
      font-weight: 700 !important;
      border-left: 3px solid var(--brand-blue) !important;
      box-shadow: inset 0 0 0 1px rgba(0, 92, 169, 0.15);
    }
    .feature-item.active .feature-code {
      background: var(--brand-blue) !important;
      color: #ffffff !important;
      border-color: var(--brand-blue) !important;
    }
    [data-theme="dark"] .feature-item.active,
    [data-theme="dark"] .nav-item-fixed a.active,
    [data-theme="dark"] .nav-folder summary.active {
      background: rgba(51, 160, 255, 0.15) !important;
      color: var(--text-blue) !important;
      border-left: 3px solid var(--text-blue) !important;
    }
    [data-theme="dark"] .feature-item.active .feature-code {
      background: var(--text-blue) !important;
      color: #0A1A2E !important;
      border-color: var(--text-blue) !important;
    }
    .feature-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 6px;
    }
    .feature-code {
      font-size: 10px;
      font-family: var(--dsc-font-mono);
      color: var(--text-muted);
      background: var(--bg-sidebar);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Seção de Governança e Apoio */
    .sidebar-footer-tools {
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      padding: 12px;
      background: var(--bg-app);
    }
    .support-group-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    /* ==========================================================================
       CONTEÚDO PRINCIPAL (100% LARGURA ÚTIL)
       ========================================================================== */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      background: var(--bg-app);
      scroll-behavior: smooth;
    }

    .content-wrapper {
      width: 100%;
      max-width: 100%;
      margin: 0;
    }

    /* Breadcrumbs semânticos */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .breadcrumb-bar a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .breadcrumb-bar a:hover {
      color: var(--brand-blue);
    }
    .breadcrumb-sep {
      color: var(--text-muted);
    }
    .breadcrumb-current {
      color: var(--text-main);
      font-weight: 600;
    }

    /* HERO DO DOCUMENTO */
    .doc-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px 32px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      position: relative;
    }

    .doc-meta-tags {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      line-height: 1.3;
    }

    .badge-fdd-level {
      background: var(--brand-blue-light);
      color: var(--brand-blue);
      border: 1px solid rgba(0, 92, 169, 0.25);
    }
    .badge-id {
      background: var(--bg-app);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-family: var(--dsc-font-mono);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .badge-id:hover {
      background: var(--border-subtle);
      border-color: var(--brand-blue);
    }

    .doc-title {
      font-family: var(--dsc-font-title);
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .doc-hierarchy-info {
      font-size: 13.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-description-block {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    /* A Descrição do N3 tem duas camadas em parágrafos consecutivos — a entrega e o
       "como se usa". Renderizada como bloco (e não inline), para que a segunda comece
       na linha de baixo; a margem do <p> é controlada aqui para não colar no título
       nem herdar o respiro padrão do navegador. */
    .hero-desc-text p {
      margin: 0 0 10px;
    }

    .hero-desc-text p:last-child {
      margin-bottom: 0;
    }

    /* SEÇÕES DE CONTEÚDO PRINCIPAIS */
    .doc-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 26px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: var(--dsc-font-title);
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* REGRAS DE NEGÓCIO ESTRUTURADAS */
    .rn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rn-card {
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      transition: all 0.2s;
    }
    .rn-card:hover {
      border-color: var(--brand-blue);
      box-shadow: var(--shadow-sm);
    }

    .rn-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .rn-num {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--dsc-font-mono);
      background: var(--brand-blue);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .rn-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-main);
    }

    .rn-body {
      font-size: 13.5px;
      color: var(--text-main);
      line-height: 1.6;
    }

    .rn-tag {
      display: inline-block;
      font-family: var(--dsc-font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--badge-purple-bg);
      color: var(--badge-purple-text);
      border: 1px solid var(--badge-purple-border);
      text-decoration: none;
    }

    /* CENÁRIOS GHERKIN FORMATADOS */
    .scenario-card {
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .scenario-header {
      background: var(--bg-sidebar);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .scenario-body {
      padding: 14px 18px;
      font-family: var(--dsc-font-mono);
      font-size: 12.5px;
      line-height: 1.7;
    }

    .gherkin-keyword {
      font-weight: 700;
    }
    .gherkin-given { color: #0284C7; }
    .gherkin-when { color: #D97706; }
    .gherkin-then { color: #059669; }
    .gherkin-and { color: #526981; }

    /* TABELAS */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .custom-table th {
      background: var(--bg-hover);
      color: var(--text-main);
      font-weight: 600;
      font-family: var(--dsc-font-title);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .custom-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
      vertical-align: top;
      line-height: 1.5;
    }

    .custom-table th:first-child,
    .custom-table td:first-child,
    .changelog-table th:first-child,
    .changelog-table td:first-child,
    .table-container table th:first-child,
    .table-container table td:first-child {
      white-space: nowrap !important;
    }

    .custom-table tbody tr:last-child td {
      border-bottom: none;
    }

    .custom-table tbody tr:hover {
      background: var(--bg-hover);
    }

    .req-tag {
      font-weight: 600;
      color: #E11D48;
      font-size: 11px;
      background: #FFE4E6;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .opt-tag {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 11px;
      background: var(--bg-hover);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    /* CHANGELOG FORMATADO */
    .changelog-table td {
      font-size: 12.5px;
    }
    .changelog-table th:first-child,
    .changelog-table td:first-child {
      white-space: nowrap;
      width: 120px;
      min-width: 110px;
    }
    .changelog-table th:nth-child(2),
    .changelog-table td:nth-child(2) {
      white-space: nowrap;
      width: 100px;
    }
    .changelog-table th:nth-child(3),
    .changelog-table td:nth-child(3) {
      white-space: nowrap;
      width: 170px;
    }

    /* DIAGRAMAS MERMAID */
    .mermaid {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      padding: 32px 20px !important;
      margin: 20px 0 !important;
      border: 1px solid var(--border-color) !important;
      border-radius: var(--radius-lg) !important;
      background: radial-gradient(circle at 1.5px 1.5px, var(--border-color) 1.5px, transparent 0) 0 0 / 22px 22px, var(--bg-app) !important;
      overflow-x: auto !important;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02) !important;
    }

    /* O Mermaid roda com `useMaxWidth: true` e emite `width="100%"` mais um
       `max-width` inline com a largura NATURAL do diagrama. Um
       `max-width: 100% !important` aqui atropelava essa medida — regra de folha
       de estilo com `!important` vence estilo inline sem `!important` — e todo
       diagrama era esticado até a largura do container: o fluxo do N2 Painel do
       Gestor, natural de 586px, abria com 1103px (1,88x), texto gigante. Os que
       pareciam certos só eram largos o bastante para a conta dar ~1x. A trava
       abaixo mantém as duas restrições ao mesmo tempo: nunca mais largo que o
       container, nunca maior que o tamanho natural. `--largura-natural` é gravada
       por `ajustaLarguraDiagramas()` a partir do viewBox; sem ela o valor cai
       para 100% e o comportamento é o de antes. */
    .mermaid svg {
      width: 100% !important;
      max-width: min(100%, var(--largura-natural, 100%)) !important;
      height: auto !important;
      margin: 0 auto !important;
      display: block !important;
    }

    .changelog-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-hover);
      color: var(--text-main);
      white-space: nowrap;
    }

    /* DETALHES TÉCNICOS (DEV ONLY) */
    .dev-only {
      border: 1px dashed var(--brand-gold);
      background: var(--brand-gold-light);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin: 16px 0;
      display: block;
      transition: all 0.3s;
    }
    /* Marcador só de visibilidade — some no Modo PO, sem estilo próprio.
       Usado em cards (.doc-section) que já têm sua própria aparência e só
       precisam desaparecer fora do Modo DEV, sem virar a caixa tracejada. */
    html:not(.app-show-dev) .dev-only,
    html:not(.app-show-dev) .dev-only-container {
      display: none !important;
    }
    /* Lista dentro da Superfície: inventário de telas, não texto corrido.
       Um N3 pode ter várias rotas — uma por Tipo de Fornecedor, por canal, por
       variante — e em parágrafo corrido não se percebe quantas são. Em lista,
       conta-se de relance. O estilo é deliberadamente mais compacto que a lista
       comum do documento, para a Superfície não competir com as regras. */
    .dev-only ul {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dev-only ul li {
      position: relative;
      padding: 4px 0 4px 18px;
      line-height: 1.55;
      border-bottom: 1px solid var(--brand-gold);
    }
    .dev-only ul li:last-child { border-bottom: 0; }
    /* O marcador é um "├" de árvore, não um bullet: cada linha é uma rota do
       mesmo processo, não um item solto. */
    .dev-only ul li::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 12px;
      width: 8px;
      height: 1px;
      background: var(--brand-gold);
      opacity: 0.8;
    }
    .dev-only ul li code {
      white-space: nowrap;
    }
    .dev-badge {
      font-size: 10.5px;
      font-weight: 700;
      background: var(--brand-gold);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: inline-block;
    }

    /* Ocultar réguas horizontais residuais */
    hr {
      display: none !important;
    }

    /* Estilos Gerais de Markdown Renderizado */
    .generic-markdown-body h1 {
      font-family: var(--dsc-font-title);
      font-size: 24px;
      font-weight: 700;
      margin: 20px 0 12px 0;
      color: var(--text-main);
    }
    .generic-markdown-body h2 {
      font-family: var(--dsc-font-title);
      font-size: 18px;
      font-weight: 700;
      margin: 24px 0 10px 0;
      color: var(--text-main);
    }
    .generic-markdown-body h3 {
      font-family: var(--dsc-font-title);
      font-size: 15px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: var(--text-main);
    }
    .generic-markdown-body p, .generic-markdown-body ul, .generic-markdown-body ol {
      margin-bottom: 14px;
    }
    .generic-markdown-body ul, .generic-markdown-body ol {
      padding-left: 24px;
    }
    .generic-markdown-body blockquote {
      border-left: 4px solid var(--brand-blue);
      background: var(--brand-blue-light);
      padding: 12px 16px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: 16px;
    }
    .generic-markdown-body pre {
      background: #0A1A2E;
      color: #F6FAFD;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      font-family: var(--dsc-font-mono);
      font-size: 12.5px;
      margin-bottom: 16px;
    }
    .generic-markdown-body code {
      font-family: var(--dsc-font-mono);
      font-size: 12px;
      background: var(--bg-hover);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .generic-markdown-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      color: inherit;
    }

    /* IFRAME DE PROTÓTIPOS */
    .prototype-iframe-container {
      width: 100%;
      height: calc(100vh - var(--header-height) - 100px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #fff;
      overflow: hidden;
    }
    .prototype-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* RODAPÉ DO DOCUMENTO */
    .doc-footer {
      margin-top: 32px;
      padding: 20px 0;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 12.5px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .doc-footer a {
      color: var(--brand-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .doc-footer a:hover {
      text-decoration: underline;
    }

    /* Loader */
    .doc-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      gap: 14px;
      color: var(--text-secondary);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast de feedback de cópia */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0A2440;
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      transform: translateY(10px);
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* ======================================================================
       MOBILE (≤900px) — a sidebar vira gaveta sobreposta
       O layout nasceu de duas colunas fixas: no celular a lateral de 320px
       comia a tela inteira e o documento ficava fora do viewport. Aqui ela
       sai do fluxo e passa a deslizar por cima, fechada por padrão; o mesmo
       botão ☰ do cabeçalho abre e fecha, e tocar num documento fecha.
       ====================================================================== */
    .sidebar-backdrop { display: none; }

    @media (max-width: 900px) {
      .app-header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; height: auto; }
      .header-left { flex: 1 1 auto; min-width: 0; }
      .header-center { flex: 1 1 100%; order: 3; }
      .header-right { flex: 0 0 auto; }
      #brandName { font-size: 15px; }
      .brand-badge { display: none; }
      .view-mode-toggle .mode-btn { padding: 6px 8px; font-size: 11px; }
      .view-mode-toggle .mode-btn svg { display: none; }

      .sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: min(86vw, 340px);
        max-width: none;
        z-index: 1200;
        box-shadow: 4px 0 24px rgba(0,0,0,.28);
        transform: translateX(0);
        transition: transform .22s ease;
      }
      /* Gaveta fechada continua no DOM (só deslocada), para o estado de
         abertura dos nós da árvore sobreviver ao abre-e-fecha. */
      .sidebar.collapsed { display: flex; transform: translateX(-102%); }
      .sidebar-resizer { display: none !important; }

      .sidebar-backdrop {
        display: block;
        position: fixed; inset: 0;
        background: rgba(0,0,0,.45);
        z-index: 1100;
        opacity: 0; pointer-events: none;
        transition: opacity .22s ease;
      }
      body.drawer-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }

      .main-viewport { width: 100%; }
      .content-wrapper { padding: 14px 12px 48px; }
      /* O cartão do documento nasceu com 32px de respiro lateral: em 390px de
         tela isso come 64px e joga o título para três linhas. */
      #documentContainer > div { padding: 18px 16px; }
      #documentContainer h1 { font-size: 24px; line-height: 1.2; }

      /* Conteúdo largo nunca empurra a página: rola dentro de si mesmo. */
      #documentContainer table { display: block; overflow-x: auto; max-width: 100%; }
      #documentContainer pre { overflow-x: auto; }
      #documentContainer img, #documentContainer svg { max-width: 100%; height: auto; }

      /* Mapa de features: cartões estreitos e rolagem própria. */
      .mm-wrap { overflow-x: auto; }
      .mm-card { width: 240px; flex-basis: 240px; }
    }

  </style>
</head>
<body>

<div class="app-container">

  <!-- ========================================================================
       1. HEADER FULL-WIDTH
       ======================================================================== -->
  <header class="app-header">
    <div class="header-left">
      <a class="brand-logo" href="#README.md" onclick="navigateTo('README.md'); return false;">
        <span class="brand-icon">
          <img class="logo-light" src="identidade-visual/logos/aval-logo.svg" alt="Aval">
          <img class="logo-dark" src="identidade-visual/logos/aval-logo-branca.svg" alt="Aval">
        </span>
        <span id="brandName">GPE</span>
        <span class="brand-badge">FDD</span>
        <span class="brand-badge" id="engineVersion" title="Versão do engine docqui em que esta instância está" style="display:none"></span>
      </a>
      
      <button class="btn-icon" id="toggleSidebarBtn" title="Recolher/expandir menu lateral" aria-label="Menu lateral">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar requisitos, regras de negócio ou termos..." oninput="handleSearch(this.value)">
        <span class="search-shortcut">⌘K</span>
      </div>

      <!-- Popover de Resultados de Busca -->
      <div class="search-results-modal" id="searchResultsModal"></div>
    </div>

    <div class="header-right">
      <!-- Toggle Modo PO / Desenvolvedor -->
      <div class="view-mode-toggle" title="Alternar visão entre Foco de Negócio (PO) e Visão Técnica">
        <button class="mode-btn active" id="btnModePO" onclick="setDocMode('po')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Visão PO
        </button>
        <button class="mode-btn" id="btnModeTech" onclick="setDocMode('tech')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          Técnico
        </button>
      </div>

      <!-- Toggle Dark/Light Mode -->
      <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar tema claro/escuro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================================================================

<script>
  // ============================================================================
  // LOGICA DO COMPORTAMENTO DO TEMPLATE FDD (AVAL / GPE)

  const APP_NAME = (globalThis.DOCS_CONFIG && DOCS_CONFIG.name) || "GPE";
  const brandNameEl = document.getElementById('brandName');
  if (brandNameEl) brandNameEl.innerText = APP_NAME;
  // A versão do engine em que a instância está — o arquivo VERSION, embutido no tree.js pelo generate-tree.
  const engineVersionEl = document.getElementById('engineVersion');
  if (engineVersionEl && typeof engineVersion !== 'undefined' && engineVersion) {
    engineVersionEl.innerText = `docqui ${engineVersion}`;
    engineVersionEl.style.display = '';
  }
  document.title = `Documentação — ${APP_NAME}`;

  let currentFilePath = "";
  let fddStructure = {};

  // Inicializar Marked com renderizador customizado
  const renderer = new marked.Renderer();
  const origCode = renderer.code;
  renderer.code = function(code, language, escaped) {
    let lang = language;
    let text = code;
    if (typeof code === 'object' && code !== null) {
      text = code.text;
      lang = code.lang;
    }
    if (lang === 'mermaid') {
      return `<div class="mermaid">${text}</div>`;
    }
    return origCode.call(this, code, language, escaped);
  };

  // Links para protótipos abrem em outra aba: o protótipo é uma página inteira, e
  // trocar o documento em leitura pelo protótipo faz o leitor perder o lugar.
  const origLink = renderer.link;
  renderer.link = function (href, title, text) {
    let h = href, ti = title, tx = text;
    if (typeof href === 'object' && href !== null) { h = href.href; ti = href.title; tx = href.text; }
    const html = origLink.call(this, href, title, text);
    return /^prototypes\/.*\.html$/.test(String(h || ''))
      ? html.replace('<a ', '<a target="_blank" rel="noopener" ')
      : html;
  };

  marked.setOptions({
    renderer: renderer,
    gfm: true,
    breaks: false,
    headerIds: true,
    mangle: false
  });

  // Tema Claro / Escuro
  function initTheme() {
    const savedTheme = localStorage.getItem('theme-pref') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
  initTheme();

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme-pref', next);
    initMermaid();
  }

  // Inicializar Mermaid
  function initMermaid() {
    if (typeof mermaid === 'undefined') return;
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true }
    });
  }
  initMermaid();

  // Grava em cada SVG a largura natural que o Mermaid calculou, lida do viewBox,
  // para o CSS travar o diagrama nela (ver `.mermaid svg`). Sem isso um fluxo
  // estreito é esticado até a largura do container e fica ilegível de tão grande.
  function ajustaLarguraDiagramas(container) {
    container.querySelectorAll('.mermaid svg').forEach(svg => {
      const viewBox = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/);
      const natural = Number(viewBox[2]);
      if (!Number.isFinite(natural) || natural <= 0) return;
      svg.style.setProperty('--largura-natural', Math.ceil(natural) + 'px');
    });
  }

  // Modo PO vs Técnico
  function setDocMode(mode) {
    const btnPO = document.getElementById('btnModePO');
    const btnTech = document.getElementById('btnModeTech');
    
    if (mode === 'tech') {
      document.documentElement.classList.add('app-show-dev');
      btnTech.classList.add('active');
      btnPO.classList.remove('active');
      localStorage.setItem('dev-only-pref', 'show');
      showToast('Modo Técnico ativo: detalhes de rotas e superfícies exibidos.');
    } else {
      document.documentElement.classList.remove('app-show-dev');
      btnPO.classList.add('active');
      btnTech.classList.remove('active');
      localStorage.setItem('dev-only-pref', 'hide');
      showToast('Modo PO ativo: detalhes técnicos ocultados.');
    }
  }

  if (localStorage.getItem('dev-only-pref') === 'show') {
    setDocMode('tech');
  }

  // Redimensionamento da Sidebar
  (function initResizer() {
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebarResizer');
    const MIN_SIDEBAR_WIDTH = 220;
    const MAX_SIDEBAR_WIDTH = 640;

    const savedWidth = localStorage.getItem('tw-sidebar-width') || localStorage.getItem('simpf-sidebar-width');
    if (savedWidth) {
      const widthNum = parseInt(savedWidth, 10);
      if (widthNum >= MIN_SIDEBAR_WIDTH && widthNum <= MAX_SIDEBAR_WIDTH) {
        sidebar.style.width = `${widthNum}px`;
      }
    }

    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      document.body.classList.add('is-resizing-sidebar');
      resizer.classList.add('is-resizing');
      document.addEventListener('mousemove', handleMouseMove);
      document.addEventListener('mouseup', handleMouseUp);
      e.preventDefault();
    });

    function handleMouseMove(e) {
      if (!isResizing) return;
      let newWidth = e.clientX;
      if (newWidth < MIN_SIDEBAR_WIDTH) newWidth = MIN_SIDEBAR_WIDTH;
      if (newWidth > MAX_SIDEBAR_WIDTH) newWidth = MAX_SIDEBAR_WIDTH;
      sidebar.style.width = `${newWidth}px`;
    }

    function handleMouseUp() {
      if (!isResizing) return;
      isResizing = false;
      document.body.classList.remove('is-resizing-sidebar');
      resizer.classList.remove('is-resizing');
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
      localStorage.setItem('tw-sidebar-width', parseInt(sidebar.style.width, 10));
    }

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      resizer.style.display = sidebar.classList.contains('collapsed') ? 'none' : 'block';
      sincronizaGaveta();
    });

    // ── Gaveta no celular ────────────────────────────────────────────────
    // No desktop a sidebar é coluna; abaixo de 900px ela vira gaveta sobre o
    // conteúdo. Nasce fechada no estreito — senão o documento abre escondido
    // atrás dela — e o backdrop acompanha o estado.
    const ESTREITO = () => window.matchMedia('(max-width: 900px)').matches;

    window.sincronizaGaveta = function () {
      const aberta = ESTREITO() && !sidebar.classList.contains('collapsed');
      document.body.classList.toggle('drawer-open', aberta);
    };
    window.fecharGaveta = function () {
      if (!ESTREITO()) return;
      sidebar.classList.add('collapsed');
      sincronizaGaveta();
    };

    if (ESTREITO()) sidebar.classList.add('collapsed');
    sincronizaGaveta();
    window.addEventListener('resize', sincronizaGaveta);
    // Tocar num documento fecha a gaveta e deixa a leitura em tela cheia.
    sidebar.addEventListener('click', (e) => { if (e.target.closest('a, summary')) setTimeout(fecharGaveta, 0); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharGaveta(); });
  })();

  // Parser de YAML Frontmatter
  function parseFrontMatter(content) {
    if (!content) return { data: {}, content: "" };
    // Cada grupo casa UM comentário só. Com `[\s\S]*?-->` solto, o documento que abre com
    // o carimbo docqui, não tem front-matter e traz adiante outro comentário seguido de
    // `---` (o `<!-- GATES:FIM -->` do modules/INDEX.md) tinha tudo até ali lido como
    // front-matter — e as seções do começo sumiam da página, sem erro.
    const match = content.match(/^\uFEFF?(?:\s*<!--(?:(?!-->)[\s\S])*-->)*\s*---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*\r?\n?/);
    if (!match) return { data: {}, content };

    const yamlStr = match[1];
    const rest = content.slice(match[0].length);
    const data = {};

    yamlStr.split('\n').forEach(line => {
      const parts = line.split(':');
      if (parts.length >= 2) {
        const key = parts[0].trim();
        const val = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
        if (key && !key.startsWith('#')) {
          data[key] = val;
        }
      }
    });

    return { data, content: rest };
  }

  // Extrair título Markdown
  function extractTitle(content) {
    if (!content) return "";
    const match = content.match(/^#\s+(.+)$/m);
    if (!match) return "";
    return match[1].replace(/^\s*(Major Feature Set|Domínio|Dominio|Feature Set|Data[\s-]Model|História de Usuário|Historia de Usuario)\s*[:\-—]*\s*/i, '').replace(/`/g, '').trim();
  }

  // Formatar data em dd/mm/aaaa
  function formatDateBR(dateStr) {
    if (!dateStr) return "";
    const m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) {
      return `${m[3]}/${m[2]}/${m[1]}`;
    }
    return dateStr;
  }

  // ============================================================================
  // CONSTRUÇÃO DA ÁRVORE FDD EM 3 NÍVEIS E SEÇÕES RECOLHÍVEIS
  // ============================================================================
  function buildFDDTree() {
    if (typeof repoFiles === 'undefined' || typeof repoFilesContent === 'undefined') {
      document.getElementById('fddTreeContainer').innerHTML = `<p style="padding:10px; color:var(--text-muted); font-size:12px;">Árvore não disponível (execute assets/generate-tree.js).</p>`;
      return;
    }

    // Checar se há rastreabilidade disponível para exibir item fixo
    if (repoFiles.some(f => f.startsWith('rastreabilidade/'))) {
      const fixedNav = document.getElementById('fixedNavList');
      if (fixedNav && !document.getElementById('navItemRastreabilidade')) {
        const li = document.createElement('li');
        li.className = 'nav-item-fixed';
        li.id = 'navItemRastreabilidade';
        li.innerHTML = `
          <a href="rastreabilidade/index.html" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.5" y1="10.5" x2="15.5" y2="6.5"></line>
              <line x1="8.5" y1="13.5" x2="15.5" y2="17.5"></line>
            </svg>
            Grafo de Rastreabilidade ↗
          </a>
        `;
        fixedNav.appendChild(li);
      }
    }

    const domains = {};
    const globalFiles = [];
    const prototypeFiles = [];
    const supportFiles = [];
    const demandaFiles = [];

    // Modelos em branco do framework (`_template-*`, `_TEMPLATE_*`) moram no
    // repositório de propósito — são a partida de um artefato novo — mas não são
    // documentação e não entram no menu. O mesmo corte já valia para os domínios
    // `modules/_*` e para o `_TEMPLATE_IMPACTO`; aqui ele passa a valer em todas as
    // seções. Nenhuma pasta `_` é cortada por ser `_`: `prototypes/_capturas` e
    // `prototypes/_biblioteca-ds` são conteúdo e continuam visíveis.
    // O engine nomeia modelo em branco de dois jeitos: prefixo (`_template-dominio.md`,
    // pasta `_template/`) e sufixo (`pending_changes_template.md`). O corte é pelo papel
    // do arquivo, não pela grafia — os dois saem do menu.
    const eModeloEmBranco = (caminho) => {
      const partes = caminho.split('/');
      const base = partes[partes.length - 1].replace(/\.[^.]+$/, '').toLowerCase();
      return partes.some(parte => parte.toLowerCase().startsWith('_template')) ||
        /[_-]template$/.test(base);
    };

    repoFiles.forEach(file => {
      if (eModeloEmBranco(file)) return;
      if (file.startsWith('modules/')) {
        const parts = file.split('/');
        // Ocultar arquivos soltos em modules/ (ex: modules/INDEX.md)
        if (parts.length <= 2 || parts[1].toLowerCase().endsWith('.md')) return;
        const domainKey = parts[1];
        if (!domainKey || domainKey.startsWith('_')) return;

        if (!domains[domainKey]) {
          domains[domainKey] = {
            key: domainKey,
            title: domainKey,
            sigla: domainKey.toUpperCase().slice(0, 4),
            readme: `modules/${domainKey}/README.md`,
            featureSets: {}
          };
        }

        if (parts.length === 3 && parts[2] === 'README.md') {
          const content = repoFilesContent[file] || "";
          const t = extractTitle(content);
          if (t) domains[domainKey].title = t;
          const siglaMatch = content.match(/- `([A-Z0-9]+)`/);
          if (siglaMatch) domains[domainKey].sigla = siglaMatch[1];
        } else if (parts.length >= 3) {
          const fsKey = parts[2];
          if (!domains[domainKey].featureSets[fsKey]) {
            domains[domainKey].featureSets[fsKey] = {
              key: fsKey,
              title: fsKey,
              readme: `modules/${domainKey}/${fsKey}/README.md`,
              features: []
            };
          }

          if (parts.length === 4 && parts[3] === 'README.md') {
            const content = repoFilesContent[file] || "";
            const t = extractTitle(content);
            if (t) domains[domainKey].featureSets[fsKey].title = t;
            // Sigla do Feature Set: o SFS do `DOM-SFS` que o N2 declara no subtítulo
            // (`> **Nível 2** - Domínio: … - \`TEM-FAQ\``). O menu mostra só o SFS — o
            // domínio já está no nó de cima, e a árvore lê TEM › FAQ › 02, como o ID
            // da feature.
            const siglaFS = content.match(/Nível 2[^`\n]*`[A-Z0-9]+-([A-Z0-9]+)`/);
            if (siglaFS) domains[domainKey].featureSets[fsKey].sigla = siglaFS[1];
          } else if (parts.length === 4 && parts[3].endsWith('.md')) {
            const content = repoFilesContent[file] || "";
            const { data } = parseFrontMatter(content);
            const title = extractTitle(content) || parts[3].replace(/^f-|\.md$/g, '');
            const code = (data.id ? data.id.split('-').pop() : parts[3].replace(/^f-|\.md$/g, '')).slice(0, 4);
            // N2 sem a sigla no subtítulo: vale a do meio do ID das suas features.
            const partesId = String(data.id || '').split('-');
            if (!domains[domainKey].featureSets[fsKey].sigla && partesId.length === 3) {
              domains[domainKey].featureSets[fsKey].sigla = partesId[1];
            }

            domains[domainKey].featureSets[fsKey].features.push({
              path: file,
              title,
              id: data.id || "",
              code
            });
          }
        }
      } else if (file.startsWith('global/')) {
        globalFiles.push(file);
      } else if (file.startsWith('prototypes/')) {
        prototypeFiles.push(file);
      } else if (file.startsWith('arquivos/demandas/')) {
        demandaFiles.push(file);
      } else if (file.startsWith('analise-impacto/')) {
        // AIMs (par .md/.html): renderDemandaFiles prefere o .html diagramado quando
        // existe o par. Os moldes `_TEMPLATE_AIM*`, prefixados com '_', ficam fora.
        if (!file.split('/').pop().startsWith('_')) demandaFiles.push(file);
      } else {
        supportFiles.push(file);
      }
    });

    fddStructure = domains;
    renderFDDTreeHTML(domains);
    renderGlobalFiles(globalFiles);

  function getFolderDisplayName(item) {
    if (item.path in FOLDER_LABELS) return FOLDER_LABELS[item.path];
    const parts = item.path.split('/');
    const last = parts[parts.length - 1];
    return last.charAt(0).toUpperCase() + last.slice(1).replace(/[-_]/g, ' ');
  }

  function getFileDisplayName(item) {
    if (item.path in FILE_LABELS) return FILE_LABELS[item.path];
    if (typeof repoFilesContent !== 'undefined') {
      const content = repoFilesContent[item.path];
      if (content) {
        const title = extractTitle(content);
        if (title) return title;
      }
    }
    const parts = item.path.split('/');
    const last = parts[parts.length - 1];
    return last.replace(/\.(md|html?)$/i, '').replace(/[-_]/g, ' ');
  }

  function getNodeDisplayName(item) {
    return item.type === 'dir' ? getFolderDisplayName(item) : getFileDisplayName(item);
  }

  function findFolderIndexFile(dirNode) {
    if (!dirNode || !dirNode.children) return null;
    const keys = Object.keys(dirNode.children);
    const pick = (name) => keys.find(k => k.toLowerCase() === name);
    const key = pick('index.md') || pick('readme.md');
    const child = key ? dirNode.children[key] : null;
    return child && child.type === 'file' ? child : null;
  }

  function buildSubTree(files, prefix) {
    const root = { name: prefix, type: "dir", children: {}, path: prefix };
    files.forEach(filePath => {
      const relPath = filePath.startsWith(prefix + '/') ? filePath.slice(prefix.length + 1) : filePath;
      const parts = relPath.split('/');
      let current = root;
      parts.forEach((part, index) => {
        const isLast = index === parts.length - 1;
        const currentPath = prefix + '/' + parts.slice(0, index + 1).join('/');
        if (isLast) {
          current.children[part] = {
            name: part,
            type: "file",
            path: currentPath
          };
        } else {
          if (!current.children[part]) {
            current.children[part] = {
              name: part,
              type: "dir",
              children: {},
              path: currentPath
            };
          }
          current = current.children[part];
        }
      });
    });
    return root;
  }

  function renderSubTreeHTML(node, getSigla) {

    keys.forEach(key => {

        html += `
