  function renderMarkdownContent(path, rawMd) {
    const { data: frontmatter, content: cleanMd } = parseFrontMatter(rawMd);
    const title = extractTitle(cleanMd) || path.split('/').pop().replace(/\.md$/i, '');
    updateBreadcrumbs(path, title, frontmatter);

    const isN3Feature = path.startsWith('modules/') && path.split('/').length === 4 && path.split('/').pop().startsWith('f-');
    const isN2FeatureSet = path.startsWith('modules/') && path.split('/').length === 4 && path.split('/')[3] === 'README.md';
    const isN1Domain = path.startsWith('modules/') && path.split('/').length === 3 && path.split('/')[2] === 'README.md';

    if (isN3Feature) {
      renderN3FeatureTemplate(path, title, frontmatter, cleanMd);
    } else if (isN2FeatureSet) {
      renderN2FeatureSetTemplate(path, title, frontmatter, cleanMd);
    } else if (isN1Domain) {
      renderN1DomainTemplate(path, title, frontmatter, cleanMd);
    } else {
      renderGenericDocumentTemplate(path, title, frontmatter, cleanMd);
    }

    const container = document.getElementById('documentContainer');

    // Link .md é navegação DENTRO do visualizador, e o hash é a rota
    // (handleHashRoute lê o caminho dele). O reescreveLinksInternos já fazia
    // isso — mas só é chamado no template de documento GENÉRICO. Nos templates
    // de N1/N2/N3 o href relativo sobrevivia e o clique tirava o leitor do
    // visualizador, entregando o Markdown cru. Aqui a reescrita é no DOM já
    // montado, então vale para todo template de uma vez, em vez de repetir a
    // chamada em cada ponto que faz marked.parse. (REP-039 do `portal-compras`.)
    // Alvo fora de repoFiles (placeholder de template, './[dominio]/[x].md')
    // fica intacto: link inerte é melhor que link errado.
    // Link que NÃO é .md tem ramo próprio, logo abaixo: aqui ele pode vir escrito a
    // partir da raiz ou relativo ao arquivo, e vale a forma que existe.
    const baseDoDoc = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
    // Rubricas ganham `id` para que âncora dentro do documento tenha alvo. O marked
    // desta versão não gera `id` nenhum, apesar do `headerIds: true` — por isso as 47
    // âncoras do REPLICACAO.md e as 2 do NFR.md apontavam para o nada, e clicar numa
    // delas trocava a ROTA (o hash é o caminho do documento) e abria "Documento não
    // encontrado". A regra do slug é a do GitHub, que é como essas âncoras foram
    // escritas à mão: minúsculas, fora tudo que não é letra/número/espaço/hífen —
    // acento fica —, espaços viram hífen.
    const usados = new Set();
    container.querySelectorAll('h1, h2, h3, h4').forEach((h) => {
      if (h.id) { usados.add(h.id); return; }
      const base = slugDeTitulo(h.textContent || '');
      if (!base) return;
      let id = base, n = 1;
      while (usados.has(id)) id = `${base}-${n++}`;
      usados.add(id);
      h.id = id;
    });

    container.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      // Âncora pura: rola até a rubrica e NÃO deixa o hash mudar — o hash é a rota.
      if (href && href.startsWith('#') && href.length > 1) {
        const alvoId = decodeURIComponent(href.slice(1));
        a.addEventListener('click', (ev) => {
          const el = container.querySelector(`[id="${CSS.escape(alvoId)}"]`);
          if (!el) return;            // âncora sem alvo: deixa como estava, não engole o clique
          ev.preventDefault();
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        return;
      }
      // esquema próprio (http:, mailto:), âncora e caminho absoluto ficam como estão
      if (!href || /^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('#') || href.startsWith('/')) return;
      const corte = href.indexOf('#');
      const doc = corte === -1 ? href : href.slice(0, corte);
      if (!doc) return;
      if (!/\.md$/i.test(doc)) {
        // Link que não é .md — o protótipo, uma planilha de exemplo, uma pasta. O
        // navegador resolveria o href contra a PÁGINA do visualizador, que mora na
        // raiz, e aqui convivem duas formas de escrevê-lo: a partir da RAIZ, que é a
        // convenção dos N3 desta instância (`prototypes/…`, ver CLAUDE.md), e relativa
        // ao ARQUIVO, que é a dos READMEs de protótipo (`./conteudo.html`) e a que
        // funciona no GitHub. Vale a que existe: primeiro a relativa ao documento,
        // depois a da raiz; o link relativo explícito (`./`, `../`) a um arquivo que o
        // tree.js não lista (`.ods`, `.xlsx`) fica com a relativa. Pasta com README
        // abre o README, dentro do visualizador. (REP-031 do `portal-compras`, que lá
        // resolve sempre contra o documento — aqui isso quebraria o elo dos N3.)
        const relativo = resolveCaminhoRelativo(baseDoDoc, doc);
        if (/\/$/.test(doc) && repoFiles.includes(relativo + '/README.md')) {
          a.setAttribute('href', '#' + relativo + '/README.md');
          return;
        }
        const alvo = repoFiles.includes(relativo) ? relativo
          : repoFiles.includes(doc) ? doc
          : /^\.\.?\//.test(doc) ? relativo : null;
        if (!alvo) return;
        a.setAttribute('href', alvo + (corte === -1 ? '' : href.slice(corte)));
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
        return;
      }
      let decodificado = doc;
      try { decodificado = decodeURIComponent(doc); } catch (e) { /* mantém como veio */ }
      // A âncora, quando o link tem uma, viaja junto no formato `#<rota>#<âncora>` —
      // o `handleHashRoute` separa as duas no ÚLTIMO `#`, porque caminho de arquivo
      // não contém `#`. (REP-049 do `portal-compras`.)
      const ancora = corte === -1 ? '' : href.slice(corte);
      for (const candidato of [doc, decodificado]) {
        const alvo = resolveCaminhoRelativo(baseDoDoc, candidato);
        if (repoFiles.includes(alvo)) { a.setAttribute('href', '#' + alvo + ancora); return; }
      }
    });

    // Pré-processamento e renderização de diagramas Mermaid
    container.querySelectorAll('pre code.language-mermaid, pre code.mermaid, code.language-mermaid').forEach(el => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      const pre = el.closest('pre') || el;
      pre.parentNode.replaceChild(div, pre);
    });

    if (typeof mermaid !== 'undefined') {
      initMermaid();
      setTimeout(async () => {
        try {
          const nodes = container.querySelectorAll('.mermaid');
          if (nodes.length > 0) {
            await mermaid.run({ nodes });
            ajustaLarguraDiagramas(container);
          }
        } catch (e) {
          console.warn('Erro ao renderizar Mermaid:', e);
        }
      }, 40);
    }
  }

  function updateBreadcrumbs(path, title, frontmatter) {
    const bar = document.getElementById('breadcrumbBar');
    let html = `<a href="#README.md" onclick="navigateTo('README.md'); return false;">Início</a>`;

    if (path.startsWith('modules/')) {
      const parts = path.split('/');
      const domKey = parts[1];
      const fsKey = parts[2];
      const dom = fddStructure[domKey];
      const fs = dom && dom.featureSets && dom.featureSets[fsKey];

      if (dom) {
        html += ` <span class="breadcrumb-sep">/</span> <a href="#${dom.readme}" onclick="navigateTo('${dom.readme}'); return false;">Domínio: ${dom.title}</a>`;
      }
      if (fs) {
        html += ` <span class="breadcrumb-sep">/</span> <a href="#${fs.readme}" onclick="navigateTo('${fs.readme}'); return false;">Feature Set: ${fs.title}</a>`;
      }
    }

    html += ` <span class="breadcrumb-sep">/</span> <span class="breadcrumb-current">${title}</span>`;
    bar.innerHTML = html;
  }

  // Template Especial para Features Nível 3
  function renderN3FeatureTemplate(path, title, frontmatter, md) {
    const idCode = frontmatter.id || path.split('/').pop().replace(/^f-|\.md$/g, '').toUpperCase();
    const parts = path.split('/');
    const dom = fddStructure[parts[1]];
    const fs = dom && dom.featureSets && dom.featureSets[parts[2]];

    const domName = dom ? dom.title : parts[1];
    const fsName = fs ? fs.title : parts[2];

    // Extrair Descrição e Não Faz
    let descText = "Registra as operações da funcionalidade.";
    let naoFazText = "";

    const descMatch = md.match(/## Descrição\s*\n([\s\S]*?)(?=\n---|\n##|\n<div|$)/);
    if (descMatch) {
      const fullDesc = descMatch[1].trim();
      const naoFazMatch = fullDesc.match(/\*\*Não faz\*\*:\s*([\s\S]*)$/i);
      if (naoFazMatch) {
        naoFazText = naoFazMatch[1].trim();
        descText = fullDesc.replace(/\*\*Não faz\*\*:\s*[\s\S]*$/i, '').trim();
      } else {
        descText = fullDesc;
      }
    }

    // Extrair blocos dev-only. O N3 tem, em geral, DOIS: a Superfície (curto,
    // vira o badge "SUPERFÍCIE TÉCNICA" abaixo) e um segundo, maior, com as
    // seções técnicas (Mapeamento de campos, Cenários técnicos, API, …) — esse
    // deve virar cards normais (mesma seção do resto do doc, classe
    // dev-only-container: some no Modo PO sem a caixa tracejada da Superfície).
    // Usar matchAll (global): com o regex sem 'g', só o primeiro bloco era
    // achado/removido, e os demais ficavam com a tag de abertura órfã no meio
    // do documento (virava uma caixa tracejada vazia) e o conteúdo saía sem
    // marca alguma de dev-only (visível também no Modo PO).
    const devBlocks = [...md.matchAll(/<div class="dev-only">([\s\S]*?)<\/div>/g)];
    let devOnlyHtml = '';
    const devSectionTitles = new Set();
    devBlocks.forEach((block, i) => {
      if (i === 0) {
        devOnlyHtml = `
          <div class="dev-only">
            <span class="dev-badge">⚙️ SUPERFÍCIE TÉCNICA (DEV ONLY)</span>
            ${marked.parse(block[1])}
          </div>
        `;
        return;
      }
      for (const m of block[1].matchAll(/^##\s+(.+)$/gm)) devSectionTitles.add(m[1].trim());
    });

    // Extrair Regras de Negócio
    let regrasHtml = '';
    // `\s*\n`, e não `\s*\n\n`: com a lista colada ao título (sem linha em branco) a
    // leitura não casava, e o corte logo abaixo tirava a seção do corpo — as regras sumiam.
    const regrasMatch = md.match(/## Regras de negócio\s*\n([\s\S]*?)(?=\n---|\n##|$)/);
    if (regrasMatch) {
      const rawRules = regrasMatch[1].trim();
      const ruleLines = rawRules.split(/\n(?=\d+\.\s+)/);
      let cards = '';

      ruleLines.forEach(line => {
        const m = line.match(/^(\d+)\.\s+([\s\S]*)$/);
        if (m) {
          const num = m[1].padStart(2, '0');
          let text = m[2];
          text = text.replace(/`([A-Z0-9_\-]+)`/g, '<span class="rn-tag">$1</span>');
          text = marked.parseInline(text);

          cards += `
            <div class="rn-card">
              <div class="rn-card-header">
                <span class="rn-num">RN-${num}</span>
              </div>
              <div class="rn-body">${text}</div>
            </div>
          `;
        }
      });

      if (cards) {
        regrasHtml = `
          <div class="doc-section">
            <div class="section-header">
              <h2 class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--brand-blue);">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                Regras de Negócio
              </h2>
            </div>
            <div class="rn-list">${cards}</div>
          </div>
        `;
      }
    }

    // Extrair Cenários Gherkin e formatar
    let cenariosHtml = '';
    const cenariosMatch = md.match(/## Cenários\s*\n\n```gherkin([\s\S]*?)```/);
    if (cenariosMatch) {
      const gherkinText = cenariosMatch[1].trim();
      const blocks = gherkinText.split(/\n(?=(?:# ←|\s*Scenario:|\s*Cenário:))/);
      let scCards = '';

      blocks.forEach(b => {
        const scTitleMatch = b.match(/(?:Scenario|Cenário):\s*(.+)/);
        if (scTitleMatch) {
          const scTitle = scTitleMatch[1].trim();
          const tagMatch = b.match(/# ← MESSAGE-DICTIONARY:\s*([A-Z0-9_]+)/);
          const tagBadge = tagMatch ? `<span class="rn-tag">${tagMatch[1]}</span>` : '';

          let linesHtml = '';
          b.split('\n').forEach(l => {
            const lineTrim = l.trim();
            if (lineTrim.startsWith('Given') || lineTrim.startsWith('Dado')) {
              linesHtml += `<div><span class="gherkin-keyword gherkin-given">Dado</span> ${lineTrim.replace(/^(Given|Dado)\s+/i, '')}</div>`;
            } else if (lineTrim.startsWith('When') || lineTrim.startsWith('Quando')) {
              linesHtml += `<div><span class="gherkin-keyword gherkin-when">Quando</span> ${lineTrim.replace(/^(When|Quando)\s+/i, '')}</div>`;
            } else if (lineTrim.startsWith('Then') || lineTrim.startsWith('Então') || lineTrim.startsWith('Entao')) {
              linesHtml += `<div><span class="gherkin-keyword gherkin-then">Então</span> ${lineTrim.replace(/^(Then|Então|Entao)\s+/i, '')}</div>`;
            } else if (lineTrim.startsWith('And') || lineTrim.startsWith('E ')) {
              linesHtml += `<div><span class="gherkin-keyword gherkin-and">E</span> ${lineTrim.replace(/^(And|E)\s+/i, '')}</div>`;
            }
          });

          scCards += `
            <div class="scenario-card">
              <div class="scenario-header">
                <span><strong>Cenário:</strong> ${scTitle}</span>
                ${tagBadge}
              </div>
              <div class="scenario-body">${linesHtml}</div>
            </div>
          `;
        }
      });

      if (scCards) {
        cenariosHtml = `
          <div class="doc-section">
            <div class="section-header">
              <h2 class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--badge-success-text);">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                Cenários de Teste & Aceite (Gherkin BDD)
              </h2>
            </div>
            ${scCards}
          </div>
        `;
      }
    }

    // Demais seções
    let restOfDoc = md
      .replace(/#\s+.*?\n/, '')
      .replace(/>\s*\*\*Nível 3\*\*.*?\n/, '')
      // A linha de metadado "> **Prioridade**: … · **MVP**: …" não vira seção: sem
      // título de `##`, ela caía num card só com o ícone, à toa no topo do documento.
      .replace(/>\s*\*\*Prioridade\*\*.*?(\n|$)/, '')
      .replace(/## Descrição[\s\S]*?(?=\n---|\n##|<div|$)/, '')
      .replace(/## Regras de negócio[\s\S]*?(?=\n---|\n##|$)/, '')
      .replace(/## Cenários[\s\S]*?(?=\n---|\n##|$)/, '');

    // 1º bloco dev-only (Superfície) já virou devOnlyHtml acima — remove por
    // completo. Os demais despem só o wrapper: o conteúdo segue no fluxo
    // normal de seções (cada ## vira card), marcado via devSectionTitles para
    // sair com class="dev-only-container" e sumir no Modo PO.
    devBlocks.forEach((block, i) => {
      restOfDoc = i === 0 ? restOfDoc.replace(block[0], '') : restOfDoc.replace(block[0], block[1]);
    });

    restOfDoc = restOfDoc.replace(/^[ \t]*---[ \t]*$/gm, '').trim();

    const sections = restOfDoc.split(/\n(?=##\s+)/);
    let sectionsHtml = '';

    sections.forEach(sec => {
      if (!sec.trim()) return;
      const secTitleMatch = sec.match(/^##\s+(.+)$/m);
      let secTitle = secTitleMatch ? secTitleMatch[1].trim() : '';
      let secBody = sec.replace(/^##\s+.*?(\n|$)/, '').trim();

      secBody = secBody.replace(/\*Feature Set:[\s\S]*$/i, '').trim();
      secBody = secBody.replace(/\*Links:[\s\S]*$/i, '').trim();
      secBody = secBody.replace(/\| (\d{4}-\d{2}-\d{2}) \|/g, (match, d) => `| ${formatDateBR(d)} |`);

      let parsedSec = marked.parse(secBody);

      const isChangelog = secTitle.toLowerCase().includes('changelog') || secTitle.toLowerCase().includes('histórico');
      const tableClass = isChangelog ? 'custom-table changelog-table' : 'custom-table';
      parsedSec = parsedSec.replace(/<table>/g, `<div class="table-container"><table class="${tableClass}">`).replace(/<\/table>/g, '</table></div>');
      parsedSec = parsedSec.replace(/<td>Sim<\/td>/g, '<td><span class="req-tag">Sim</span></td>');
      parsedSec = parsedSec.replace(/<td>Não<\/td>/g, '<td><span class="opt-tag">Não</span></td>');
      parsedSec = parsedSec.replace(/<hr\s*\/?>/g, '');

      if (isChangelog) {
        parsedSec = parsedSec.replace(/<td>(Aval do PO|Requisitos aprovados|Saneamento|Catalogação|Correção|Ajuste|Feature criada)(.*?)<\/td>/g, (m, p1, p2) => {
          let color = '';
          if (p1 === 'Aval do PO' || p1 === 'Requisitos aprovados') color = 'style="background:#ECFDF5; color:#047857;"';
          else if (p1 === 'Correção') color = 'style="background:#FFFBEB; color:#B45309;"';
          return `<td><span class="changelog-badge" ${color}>${p1}${p2}</span></td>`;
        });
      }

      sectionsHtml += `
        <div class="doc-section${devSectionTitles.has(secTitle) ? ' dev-only-container' : ''}">
          <div class="section-header">
            <h2 class="section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--brand-blue);">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              ${secTitle}
            </h2>
          </div>
          <div class="generic-markdown-body">
            ${parsedSec}
          </div>
        </div>
      `;
    });

    const html = `
      <!-- HERO CARD -->
      <div class="doc-hero-card">
        <div class="doc-meta-tags">
          <span class="badge badge-fdd-level">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            Nível 3 · Feature
          </span>
          <span class="badge badge-id" onclick="copyId('${idCode}')" title="Clique para copiar">
            ${idCode}
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
        </div>

        <h1 class="doc-title">${title}</h1>
        <div class="doc-hierarchy-info">
          <span><strong>Nível 3</strong></span> &bull; 
          <span>Feature Set: <strong>${fsName}</strong></span> &bull; 
          <span>Domínio: <strong>${domName}</strong></span>
        </div>

        <div class="hero-description-block">
          <h2 style="font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Descrição</h2>
          <div class="hero-desc-text" style="font-size: 14px; color: var(--text-main); line-height: 1.6; margin-bottom: ${naoFazText ? '10px' : '0'};">
            ${marked.parse(descText)}
          </div>
          ${naoFazText ? `
            <p style="font-size: 13.5px; color: var(--text-secondary); line-height: 1.6;">
              <strong style="color: var(--text-main);">Não faz:</strong> ${marked.parseInline(naoFazText)}
            </p>
          ` : ''}
        </div>
      </div>

      ${devOnlyHtml}
      ${regrasHtml}
      ${cenariosHtml}
      ${sectionsHtml}

      <footer class="doc-footer">
        <div>Feature Set: <strong>${fsName}</strong> &bull; Domínio: <strong>${domName}</strong></div>
        <div><a href="#README.md" onclick="navigateTo('README.md'); return false;">Voltar ao Início</a></div>
      </footer>
    `;

    document.getElementById('documentContainer').innerHTML = html;
  }

  // Template para Feature Sets Nível 2
  function renderN2FeatureSetTemplate(path, title, frontmatter, md) {
    const parts = path.split('/');
    const dom = fddStructure[parts[1]];
    const fsObj = dom && dom.featureSets && dom.featureSets[parts[2]];

    const domName = dom ? dom.title : parts[1];
    const fsName = fsObj ? fsObj.title : title.replace(/^Feature Set:\s*/i, '');
    
    const siglaMatch = md.match(/`([A-Z0-9-]+)`/);
    const idCode = siglaMatch ? siglaMatch[1] : (dom ? dom.sigla : 'N2');

    let descText = "";
    let naoFazText = "";
    const descMatch = md.match(/## Descrição\s*\n([\s\S]*?)(?=\n---|\n##|$)/);
    if (descMatch) {
      const fullDesc = descMatch[1].trim();
      const naoFazMatch = fullDesc.match(/\*\*Não faz\*\*:\s*([\s\S]*)$/i);
      if (naoFazMatch) {
        naoFazText = naoFazMatch[1].trim();
        descText = fullDesc.replace(/\*\*Não faz\*\*:\s*[\s\S]*$/i, '').trim();
      } else {
        descText = fullDesc;
      }
    }

    const bodyMd = md
      .replace(/^#\s+[^\n]+\n(?:>\s*[^\n]+\n)?/m, '')
      .replace(/## Descrição\s*\n[\s\S]*?(?=\n---|\n##|$)/, '')
      .trim();

    const rawSections = bodyMd.split(/\n(?=##\s+)/);
    let sectionsHtml = '';

    rawSections.forEach(sec => {
      let secClean = sec.replace(/^---\s*\n?/m, '').trim();
      if (!secClean) return;

      const secTitleMatch = secClean.match(/^##\s+(.+)$/m);
      if (!secTitleMatch) return;
      const secTitle = secTitleMatch[1].trim();
      let secContent = secClean.replace(/^##\s+.+$/m, '').trim();

      secContent = secContent.replace(/href="(?!\/|#|http)(f-[^"]+\.md)"/g, `href="#modules/${parts[1]}/${parts[2]}/$1" onclick="navigateTo('modules/${parts[1]}/${parts[2]}/$1'); return false;"`);
      secContent = secContent.replace(/\]\((f-[^\)]+\.md)\)/g, `](#modules/${parts[1]}/${parts[2]}/$1)`);

      let renderedSec = marked.parse(secContent);
      
      const isChangelog = secTitle.toLowerCase().includes('histórico') || secTitle.toLowerCase().includes('changelog');
      const tableClass = isChangelog ? 'custom-table changelog-table' : 'custom-table';

      renderedSec = renderedSec
        .replace(/<table>/g, `<div class="table-container"><table class="${tableClass}">`)
        .replace(/<\/table>/g, '</table></div>');

      renderedSec = renderedSec.replace(/\| (\d{4}-\d{2}-\d{2}) \|/g, (match, d) => `| ${formatDateBR(d)} |`);

      let icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>`;

      } else if (secTitle.toLowerCase().includes('fluxo')) {
        icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M6 9v12M18 9a9 9 0 0 0-9 9"></path></svg>`;
      } else if (secTitle.toLowerCase().includes('tela')) {
        icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`;
      } else if (secTitle.toLowerCase().includes('permiss')) {
        icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`;
      } else if (secTitle.toLowerCase().includes('depend')) {

    const html = `

        <div class="doc-meta-tags">
          <span class="badge badge-fdd-level">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>

            </svg>
            Nível 2 · Feature Set
          </span>
          <span class="badge badge-id" onclick="copyId('${idCode}')" title="Clique para copiar">
            ${idCode}
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
        </div>

        <h1 class="doc-title">${fsName}</h1>
        <div class="doc-hierarchy-info">
          <span><strong>Nível 2</strong></span> &bull; 
          <span>Domínio: <strong>${domName}</strong></span>

  // Template para Domínios Nível 1
  function renderN1DomainTemplate(path, title, frontmatter, md) {
    const parts = path.split('/');
    const dom = fddStructure[parts[1]];
    const domName = dom ? dom.title : title.replace(/^(?:Major Feature Set|Domínio):\s*/i, '');
    const idCode = dom ? dom.sigla : 'N1';

    // `\n##` sozinho também "acha" o início de um `### ` — um N1 pode ter sub-seção
    // (ex.: "### O que este domínio NÃO faz", com tabela) DENTRO de "## Descrição", e
    // o corte batia ali, perdendo o H3 e a tabela por inteiro. `##\s` (só duas
    // cardinais) não bate no terceiro `#` de `### `. (Correção trazida do `portal-compras`.)
    let descText = "";
    const descMatch = md.match(/## Descrição\s*\n([\s\S]*?)(?=\n---|\n##\s|$)/);
    if (descMatch) {
      descText = descMatch[1].trim();
    }

    const bodyMd = md
      .replace(/^#\s+[^\n]+\n(?:>\s*[^\n]+\n)?/m, '')
      .replace(/## Descrição\s*\n[\s\S]*?(?=\n---|\n##\s|$)/, '')
      .trim();

    const rawSections = bodyMd.split(/\n(?=##\s+)/);
    let sectionsHtml = '';

    rawSections.forEach(sec => {
      let secClean = sec.replace(/^---\s*\n?/m, '').trim();
      if (!secClean) return;

      const secTitleMatch = secClean.match(/^##\s+(.+)$/m);
      if (!secTitleMatch) return;
      const secTitle = secTitleMatch[1].trim();
      let secContent = secClean.replace(/^##\s+.+$/m, '').trim();

      // Só o link para um Feature Set DESTE domínio (`./fs/README.md`) é reescrito aqui. O
      // link para outro N1 (`../pessoas/README.md`) fica como está: quem o resolve é o
      // pós-processamento do DOM, contra a pasta do documento — reescrito aqui, virava
      // `modules/<este-domínio>/./pessoas/README.md`, que não existe.
      secContent = secContent.replace(/href="(?!\/|#|http|\.\.\/)\.?\/?([^"]+\/README\.md)"/g, `href="#modules/${parts[1]}/$1" onclick="navigateTo('modules/${parts[1]}/$1'); return false;"`);
      secContent = secContent.replace(/\]\((?!\.\.\/)\.?\/?([^\)]+\/README\.md)\)/g, `](#modules/${parts[1]}/$1)`);

      let renderedSec = marked.parse(secContent);
      const isChangelog = secTitle.toLowerCase().includes('histórico') || secTitle.toLowerCase().includes('changelog');
      const tableClass = isChangelog ? 'custom-table changelog-table' : 'custom-table';

      renderedSec = renderedSec
        .replace(/<table>/g, `<div class="table-container"><table class="${tableClass}">`)
        .replace(/<\/table>/g, '</table></div>');
      renderedSec = renderedSec.replace(/\| (\d{4}-\d{2}-\d{2}) \|/g, (match, d) => `| ${formatDateBR(d)} |`);

      let icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>`;

      } else if (secTitle.toLowerCase().includes('regras')) {
        icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline></svg>`;
      } else if (secTitle.toLowerCase().includes('integra')) {
        icon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.5" y1="10.5" x2="15.5" y2="6.5"></line><line x1="8.5" y1="13.5" x2="15.5" y2="17.5"></line></svg>`;
      }

      sectionsHtml += `

          </div>
        </div>
      `;
    });

    const html = `

  // Resolve um caminho relativo contra o diretório de um documento ('a/b' + '../c' → 'a/c')
  function resolveCaminhoRelativo(base, rel) {
    const partes = base ? base.split('/') : [];
    rel.split('/').forEach(seg => {
      if (seg === '' || seg === '.') return;
      if (seg === '..') partes.pop(); else partes.push(seg);
    });
    return partes.join('/');
  }

  // Um link relativo para .md dentro de um documento aponta para outro arquivo DESTE
  // repositório. Sem reescrita, clicar nele tira o navegador do visualizador e entrega
  // o Markdown cru. Alvo que não existe em repoFiles (placeholder de template) fica intacto.
  function reescreveLinksInternos(html, path) {
    const base = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
    return html.replace(/href="(?!#|\/|[a-z]+:)([^"']+?\.md)"/gi, (bruto, rel) => {
      let decodificado = rel;
      try { decodificado = decodeURIComponent(rel); } catch (e) { /* mantém como veio */ }
      for (const candidato of [rel, decodificado]) {
        const alvo = resolveCaminhoRelativo(base, candidato);
        if (alvo.indexOf("'") === -1 && repoFiles.includes(alvo)) {
          return `href="#${alvo}" onclick="navigateTo('${alvo}'); return false;"`;
        }
      }
      return bruto;
    });
  }

  // Template para Documentos Gerais (MASTER, README, etc.)
  // Slug no padrão GitHub — mesma regra com que as âncoras dos documentos foram
  // escritas à mão (`#rep-041--o-verifica-texto-corrido-...`): minúsculas, fora o que
  // não é letra/número/espaço/hífen (acento fica, emoji e crase saem), espaço vira hífen.
  function slugDeTitulo(texto) {
    // Espaço a espaço, não `\s+`: o travessão some e deixa DOIS espaços, que viram dois
    // hífens (`rep-041--o-verifica…`). Colapsar aqui produziria um hífen só e a âncora
    // escrita à mão no documento não casaria com a rubrica.
    return texto.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s/g, '-');
  }

  // Cabeçalho de card idêntico ao das seções do N3 — mesmo ícone, mesma tipografia.
  // É a forma que o leitor já associa a "um bloco de conteúdo" no visualizador.
  function cabecalhoDeCard(titulo) {
    return `
      <div class="section-header">
        <h2 class="section-title" id="${slugDeTitulo(titulo)}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--brand-blue);">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          ${titulo}
        </h2>
      </div>`;
  }

  function renderizaBloco(md, path, tiraRegua) {
    let r = marked.parse(md);
    r = reescreveLinksInternos(r, path);
    r = r.replace(/<table>/g, '<div class="table-container"><table class="custom-table">').replace(/<\/table>/g, '</table></div>');
    r = r.replace(/\| (\d{4}-\d{2}-\d{2}) \|/g, (match, d) => `| ${formatDateBR(d)} |`);
    if (tiraRegua) r = r.replace(/<hr\s*\/?>/g, '');
    return r;
  }

  // Dicionário canônico: cada entrada `### <nome>` da seção `## Entradas` vira um card
  // próprio. Numa lista corrida — 12 campos ou 6 regras dentro de um card só — não se
  // enxerga onde uma entrada acaba e a seguinte começa, e é justamente a entrada que
  // se consulta. Devolve null quando o documento não tem a seção, e aí nada muda.
  function entradasDeDicionario(md) {
    const linhas = md.split('\n');
    const ini = linhas.findIndex((l) => /^##\s+Entradas\s*$/.test(l));
    if (ini === -1) return null;
    let fim = linhas.length;
    let cerca = false;
    for (let i = ini + 1; i < linhas.length; i++) {
      if (/^\s*(```|~~~)/.test(linhas[i])) { cerca = !cerca; continue; }
      if (!cerca && /^##\s+/.test(linhas[i])) { fim = i; break; }
    }
    // Dentro da seção, quebra em `### <nome>` — ignorando o que estiver em cerca de
    // código, porque a entrada traz cenários Gherkin.
    const corpo = linhas.slice(ini + 1, fim);
    const intro = [];
    const entradas = [];
    cerca = false;
    for (const l of corpo) {
      if (/^\s*(```|~~~)/.test(l)) cerca = !cerca;
      const h = !cerca && l.match(/^###\s+(.+?)\s*$/);
      if (h) { entradas.push({ titulo: h[1], linhas: [] }); continue; }
      (entradas.length ? entradas[entradas.length - 1].linhas : intro).push(l);
    }
    if (!entradas.length) return null;
    return { antes: linhas.slice(0, ini + 1).concat(intro).join('\n'), entradas, depois: linhas.slice(fim).join('\n') };
  }

  function renderGenericDocumentTemplate(path, title, frontmatter, md) {
    const dicionario = /-DICTIONARY\.md$/i.test(path) ? entradasDeDicionario(md) : null;

    let rendered;
    if (dicionario) {
      rendered =
        `<div class="doc-section generic-markdown-body">${renderizaBloco(dicionario.antes, path, true)}</div>` +
        dicionario.entradas.map((e) => `
          <div class="doc-section">
            ${cabecalhoDeCard(e.titulo)}
            <div class="generic-markdown-body">${renderizaBloco(e.linhas.join('\n'), path, true)}</div>
          </div>`).join('') +
        (dicionario.depois.trim()
          ? `<div class="doc-section generic-markdown-body">${renderizaBloco(dicionario.depois, path, true)}</div>`
          : '');
    } else {
      rendered = `<div class="doc-section generic-markdown-body">${renderizaBloco(md, path, false)}</div>`;
    }

    const html = `
      ${rendered}
      <footer class="doc-footer">
        <div>Arquivo: <code>${path}</code></div>
        <div><a href="#README.md" onclick="navigateTo('README.md'); return false;">Voltar ao Início</a></div>
      </footer>
    `;

    document.getElementById('documentContainer').innerHTML = html;
  }

  // ============================================================================
  // TELA INTERATIVA: MAPA DE FEATURES (FDD CANVAS)
  // ============================================================================
  // Escapa também as aspas: o retorno alimenta atributos (data-text, title), e um
  // texto com " fechava o atributo antes da hora — truncava a busca do mapa.
  function mmEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function mmOpenLink(path) {
    if (!path) return '';
    return '<a class="mm-open" href="#' + encodeURI(path) + '" onclick="navigateTo(\'' + mmEsc(path) + '\'); event.stopPropagation(); return false;"'
      + ' title="Abrir o artefato">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>'
      + '<span>abrir</span></a>';
  }

  // `camadas` (opcional, só nos N3): as camadas 2 e 3 da descrição — o que É o
  // objeto entregue e COMO SE USA a funcionalidade. Cada uma é um bloco rotulado
  // sob a entrega, para o card se explicar sem abrir o documento.
  function mmCard(cls, dataText, badge, nome, desc, foot, kidsHTML, leaf, camadas) {
    const extras = (camadas || [])
      .filter(function (c) { return c && c.txt; })
      .map(function (c) {
        return '<div class="mm-camada mm-' + c.cls + '">'
          + '<span class="mm-rot">' + mmEsc(c.rot) + '</span>' + mmEsc(c.txt) + '</div>';
      }).join('');
    return '<div class="mm-node ' + cls + (leaf ? ' mm-leaf' : '') + '" data-text="' + mmEsc(dataText).toLowerCase() + '">'
      + '<div class="mm-card" onclick="mmToggle(this)">'
      + '<div class="mm-badge">' + badge + '</div>'
      + '<div class="mm-name">' + mmEsc(nome) + '</div>'
      + (desc ? '<div class="mm-desc">' + mmEsc(desc) + '</div>' : '')
      + extras
      + (foot || '')
      + '</div>'
      + (kidsHTML ? '<div class="mm-kids"><div class="mm-bus"></div>' + kidsHTML + '</div>' : '')
      + '</div>';
  }

        }).join('');
        const foot = '<div class="mm-foot"><span class="mm-count">' + fs.feats.length + ' feature' + (fs.feats.length === 1 ? '' : 's') + '</span>' + mmOpenLink(fs.path) + '<span class="mm-caret">▸</span></div>';
        return mmCard('lvl-n2', fs.sigla + ' ' + fs.nome + ' ' + (fs.desc || ''), 'N2 · ' + mmEsc(fs.sigla), fs.nome, fs.desc, foot, feats, false);
      }).join('');
      const foot = '<div class="mm-foot"><span class="mm-count">' + d.fss.length + ' feature set' + (d.fss.length === 1 ? '' : 's') + '</span>' + mmOpenLink(d.path) + '<span class="mm-caret">▸</span></div>';
      return mmCard('lvl-n1', d.sigla + ' ' + d.nome + ' ' + (d.desc || ''), 'N1 · ' + mmEsc(d.sigla), d.nome, d.desc, foot, fss, false);
    }).join('');

    const canvasEl = document.getElementById('mm-canvas');
    if (canvasEl) {
      canvasEl.innerHTML = doms || '<div style="padding:20px; color:var(--text-muted);">Nenhum domínio cadastrado no mapa.</div>';
    }

    if (M.kpi) {
      const kpiDom = document.getElementById('mm-kpi-dom');
      const kpiFs = document.getElementById('mm-kpi-fs');
      const kpiFeat = document.getElementById('mm-kpi-feat');
      if (kpiDom) kpiDom.textContent = (M.kpi.dominios || 0) + ' domínios';
      if (kpiFs) kpiFs.textContent = (M.kpi.fss || 0) + ' feature sets';
      if (kpiFeat) kpiFeat.textContent = (M.kpi.feats || 0) + ' features';
      const _gaps = (M.kpi.fssVazios || 0) + (M.kpi.domsVazios || 0);
      const _kg = document.getElementById('mm-kpi-gap');
      if (_kg) {
        const totN2 = M.kpi.fss || 0;
        const cob = totN2 ? Math.round(100 * (totN2 - (M.kpi.fssVazios || 0)) / totN2) : 100;
        _kg.textContent = _gaps ? (_gaps + ' lacuna' + (_gaps === 1 ? '' : 's') + ' · cobertura ' + cob + '%') : ('cobertura ' + cob + '% · sem lacunas');
        _kg.classList.toggle('is-gap', _gaps > 0);
      }
      const _bg = document.getElementById('mm-btn-gaps');
      if (_bg) _bg.style.display = _gaps ? '' : 'none';
    }

    mmZoom = null;
    mmResetCollapse();
    let _descModo = 'tudo';
    try { _descModo = localStorage.getItem('mapa-desc-modo') || 'tudo'; } catch (e) {}
    mmSetDesc(_descModo);
  }

  function mmResetCollapse() {
    document.querySelectorAll('#mm-canvas .mm-node').forEach(n => n.classList.remove('mm-collapsed'));
    document.querySelectorAll('#mm-canvas .mm-node.lvl-n2').forEach(n => n.classList.add('mm-collapsed'));
  }
  function mmToggle(card) {
    const n = card.closest('.mm-node');
    if (n.classList.contains('mm-leaf')) return;
    n.classList.toggle('mm-collapsed');
    mmLayout();
  }
  function mmAll(collapse) {
    document.querySelectorAll('#mm-canvas .mm-node:not(.mm-leaf)').forEach(n => n.classList.toggle('mm-collapsed', collapse));
    mmLayout();
  }
  function mmFit() {
    const canvas = document.getElementById('mm-canvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    if (!wrap) return;
    canvas.style.zoom = '1';
    if (mmZoom != null) {
      canvas.style.zoom = String(mmZoom);
    } else {
      const content = canvas.scrollWidth;
      if (content > 0) canvas.style.zoom = String(Math.max(1, Math.min((wrap.clientWidth - 30) / content, 2)));
    }
    mmZoomLabel();
  }
  const MM_ZOOM_MIN = 0.3, MM_ZOOM_MAX = 2;
  function mmZoomEfetivo() {
    if (mmZoom != null) return mmZoom;
    const canvas = document.getElementById('mm-canvas');
    return canvas ? (parseFloat(canvas.style.zoom) || 1) : 1;
  }
  function mmZoomLabel() {
    const el = document.getElementById('mm-zoom-val');
    if (el) el.textContent = Math.round(mmZoomEfetivo() * 100) + '%';
    const fit = document.querySelector('.mm-zoom-fit');
    if (fit) fit.classList.toggle('is-on', mmZoom != null);
  }
  function mmZoomBy(step) {
    mmZoom = Math.max(MM_ZOOM_MIN, Math.min(mmZoomEfetivo() + step, MM_ZOOM_MAX));
    const canvas = document.getElementById('mm-canvas');
    if (canvas) canvas.style.zoom = String(mmZoom);
    mmZoomLabel();
  }
  function mmZoomFit() {
    mmZoom = null;
    mmLayout();
  }
  function mmToggleSynthetic(btn) {
    const wrap = document.querySelector('.mm-wrap');
    if (!wrap) return;
    const isSynthetic = wrap.classList.toggle('mm-synthetic');
    if (btn) {
      btn.classList.toggle('is-on', isSynthetic);
      btn.setAttribute('aria-pressed', isSynthetic ? 'true' : 'false');
    }
    setTimeout(mmLayout, 30);
  }
  function mmLayout() {
    const canvas = document.getElementById('mm-canvas');
    if (!canvas) return;
    canvas.style.zoom = '1';
    document.querySelectorAll('#mm-canvas .mm-kids').forEach(function (k) {
      const bus = k.querySelector(':scope > .mm-bus');
      if (!bus) return;
      if (!k.offsetParent) return;
      const nodes = [].slice.call(k.children).filter(c => c.classList && c.classList.contains('mm-node') && !c.classList.contains('mm-hidden'));
      if (nodes.length < 1) { bus.style.display = 'none'; return; }
      bus.style.display = 'block';
      // O barramento liga o CENTRO DO CARD do primeiro filho ao do último — é onde
      // saem os tocos horizontais (.mm-card::before, em top:50% do card). Medir pelo
      // .mm-node daria o centro da SUBÁRVORE inteira: com filhos abaixo, o traço
      // começava longe do primeiro card (sem tocar a linha do pai) e sobrava para
      // baixo do último. Medido por rect, para não depender de offsetParent.
      const kr = k.getBoundingClientRect();
      const centro = function (n) {
        const card = n.querySelector(':scope > .mm-card') || n;
        const cr = card.getBoundingClientRect();
        return cr.top - kr.top + cr.height / 2;
      };
      const top = centro(nodes[0]);
      const bot = centro(nodes[nodes.length - 1]);
      bus.style.top = top + 'px';
      bus.style.height = Math.max(0, bot - top) + 'px';
    });
    mmFit();
  }
  function mmFilterNode(n, term) {
    const kids = n.querySelector(':scope > .mm-kids');
    let childMatch = false;
    if (kids) {
      [].slice.call(kids.children).forEach(function (c) {
        if (c.classList && c.classList.contains('mm-node')) { if (mmFilterNode(c, term)) childMatch = true; }
      });
    }
    const selfMatch = term && (n.getAttribute('data-text') || '').indexOf(term) >= 0;
    n.classList.toggle('mm-hit', !!selfMatch);
    const keep = selfMatch || childMatch;
    n.classList.toggle('mm-hidden', !keep);
    if (childMatch) n.classList.remove('mm-collapsed');
    return keep;
  }
  function mmSearch(v) {
    const term = (v || '').trim().toLowerCase();
    if (!term) {
      document.querySelectorAll('#mm-canvas .mm-node').forEach(n => n.classList.remove('mm-hidden', 'mm-hit'));
      mmResetCollapse();
      mmLayout();
      return;
    }
    document.querySelectorAll('#mm-canvas > .mm-node').forEach(r => mmFilterNode(r, term));
    mmLayout();
  }
  function mmGapKeep(n) {
    const kids = n.querySelector(':scope > .mm-kids');
    let childKeep = false;
    if (kids) [].slice.call(kids.children).forEach(function (c) {
      if (c.classList && c.classList.contains('mm-node')) { if (mmGapKeep(c)) childKeep = true; }
    });
    const keep = n.classList.contains('mm-gap') || childKeep;
    n.classList.toggle('mm-hidden', !keep);
    if (childKeep) n.classList.remove('mm-collapsed');
    return keep;
  }
  function mmOnlyGaps(on) {
    if (!document.getElementById('mm-canvas')) return;
    if (on) {
      document.querySelectorAll('#mm-canvas > .mm-node').forEach(r => mmGapKeep(r));
    } else {
      document.querySelectorAll('#mm-canvas .mm-node').forEach(n => n.classList.remove('mm-hidden'));
      mmResetCollapse();
    }
    mmLayout();
  }
  // Descrição do card em três níveis: 'tudo' (as três camadas), 'entrega' (só o
  // que a feature entrega) e 'nada' (mapa enxuto, só nome e ID).
  const MM_DESC_MODOS = ['tudo', 'entrega', 'nada'];
  function mmSetDesc(modo) {
    if (MM_DESC_MODOS.indexOf(modo) < 0) modo = 'tudo';
    const canvas = document.getElementById('mm-canvas');
    if (canvas) {
      canvas.classList.toggle('mm-desc-entrega', modo === 'entrega');
      canvas.classList.toggle('mm-desc-nada', modo === 'nada');
    }
    // Controle segmentado: o estado é qual segmento está aceso, não o rótulo de um
    // botão que troca de texto — antes o botão dizia o modo vigente e ciclava ao
    // clique, e não dava para saber se o rótulo era o estado atual ou o próximo.
    document.querySelectorAll('.mm-seg [data-desc]').forEach(function (b) {
      const ativo = b.getAttribute('data-desc') === modo;
      b.classList.toggle('is-on', ativo);
      b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
    });
    try { localStorage.setItem('mapa-desc-modo', modo); } catch (e) {}
    mmLayout();
  }
  function mmDescModo() {
    const canvas = document.getElementById('mm-canvas');
    if (!canvas) return 'tudo';
    if (canvas.classList.contains('mm-desc-nada')) return 'nada';
    if (canvas.classList.contains('mm-desc-entrega')) return 'entrega';
    return 'tudo';
  }
  // Busca instantânea
  function handleSearch(query) {
    const modal = document.getElementById('searchResultsModal');
    if (!query || query.trim().length < 2) {
      modal.classList.remove('show');
      modal.innerHTML = '';
      return;
    }

    const q = query.toLowerCase().trim();
    const results = [];

    if (typeof repoFiles !== 'undefined') {
      repoFiles.forEach(file => {
        const content = (typeof repoFilesContent !== 'undefined' && repoFilesContent[file]) || "";
        const title = extractTitle(content) || file;
        
        if (title.toLowerCase().includes(q) || file.toLowerCase().includes(q) || content.toLowerCase().includes(q)) {
          results.push({ path: file, title });
        }
      });
    }

    if (results.length === 0) {
      modal.innerHTML = `<div style="padding:14px; font-size:12.5px; color:var(--text-muted);">Nenhum resultado encontrado para "${query}".</div>`;
    } else {
      let html = '';
      results.slice(0, 10).forEach(res => {
        html += `
          <a class="search-result-item" href="#${res.path}" onclick="navigateTo('${res.path}'); document.getElementById('searchResultsModal').classList.remove('show'); return false;">
            <span class="search-result-title">${res.title}</span>
            <span class="search-result-path">${res.path}</span>
          </a>
        `;
      });
      modal.innerHTML = html;
    }

    modal.classList.add('show');
  }

  // Fechar busca ao clicar fora
  document.addEventListener('click', (e) => {
    const searchBox = document.querySelector('.search-box');
    const modal = document.getElementById('searchResultsModal');
    if (searchBox && modal && !searchBox.contains(e.target)) {
      modal.classList.remove('show');
    }
  });

  // Atalho de teclado ⌘K / Ctrl+K
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      const input = document.getElementById('searchInput');
      if (input) input.focus();
    } else if (e.key === 'Escape') {
      const modal = document.getElementById('searchResultsModal');
      if (modal) modal.classList.remove('show');
    }
  });

  // Copiar ID
  function copyId(id) {
    navigator.clipboard.writeText(id);
    showToast(`Identificador "${id}" copiado!`);
  }

  function showToast(text) {
    const toast = document.getElementById('toastMessage');
    if (!toast) return;
    toast.innerText = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // Inicialização Robusta da SPA
  function handleHashRoute() {
    const rawHash = decodeURIComponent(window.location.hash.substring(1));
    // `#caminho/do/arquivo.md#ancora`: o caminho é tudo até o ÚLTIMO `#`. Só vale como
    // âncora se o que vem antes for um arquivo conhecido — assim um `#` no meio de um
    // nome de arquivo não vira separador por engano.
    const ult = rawHash.lastIndexOf('#');
    let alvo = rawHash, ancora = '';
    if (ult > 0) {
      const candidato = rawHash.slice(0, ult);
      if (typeof repoFiles !== 'undefined' && repoFiles.includes(candidato)) {
        alvo = candidato;
        ancora = rawHash.slice(ult + 1);
      }
    }
    loadFile(alvo || "README.md");
    if (!ancora) return;
    // O documento é montado de forma síncrona a partir do conteúdo embutido, mas o
    // realce de código e os diagramas ainda mexem na altura — daí o quadro seguinte.
    requestAnimationFrame(() => {
      const el = document.getElementById('documentContainer')?.querySelector(`[id="${CSS.escape(ancora)}"]`);
      if (el) el.scrollIntoView({ block: 'start' });
    });
  }

  function initApp() {
    buildFDDTree();
    handleHashRoute();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

  window.addEventListener('hashchange', handleHashRoute);
</script>
